# Blueprint Render : service web Node + base PostgreSQL.
# Render > New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: la-fabrique
    runtime: node
    plan: free
    region: frankfurt
    # Le seed est idempotent : il crée le compte Bureau et les textes au premier déploiement, puis ne change plus rien.
    buildCommand: npm ci && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: la-fabrique-db
          property: connectionString
      # Valeurs demandées par Render à la création du Blueprint (jamais écrites dans le dépôt)
      - key: APP_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: la-fabrique-db
    plan: free
    region: frankfurt
    databaseName: fabrique
    user: fabrique
