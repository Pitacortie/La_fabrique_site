# Blueprint Render : service web Node + base PostgreSQL.
# Render > New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: la-fabrique
    runtime: node
    plan: free
    region: frankfurt
    # Le seed est idempotent : il crée le compte Bureau et les textes au premier déploiement, puis ne change plus rien.
    # Comptes de démo (camille@…, dominique@…, sacha@…, lou@…) : créés une seule fois si DEMO_COMPTES=1, jamais écrasés.
    buildCommand: npm ci && npx prisma migrate deploy && npx prisma db seed && node prisma/demo-adherent.mjs --si-absent && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: la-fabrique-db
          property: connectionString
      # Valeurs demandées par Render à la création du Blueprint (jamais écrites dans le dépôt)
      - key: APP_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Envoi des courriels (Brevo) : à remplir dans Render > Environment. Sans SMTP_HOST, ils s'affichent dans les logs.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: "La Fabrique de Ménesplet <contact@lafabriquedemenesplet.fr>"
      # Site de démonstration : crée les 4 adhérents de démo. À passer à 0 (ou retirer) pour le vrai site.
      - key: DEMO_COMPTES
        value: "1"
      # Secret des tâches quotidiennes, généré par Render (à recopier dans les secrets GitHub)
      - key: TACHES_SECRET
        generateValue: true

databases:
  - name: la-fabrique-db
    plan: free
    region: frankfurt
    databaseName: fabrique
    user: fabrique
